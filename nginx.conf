server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik terminates TLS in front of this container, so redirects must stay relative.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/markdown text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;

    # One URL per page: /blog/ -> /blog
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Raw post markdown for agents and readers.
    location ~ \.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # Pages are built as /blog/<slug>.html and served without the extension.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
